<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <title>MLSS 2026 — Hero Pipeline Skeleton</title>
  <desc>Editable SVG skeleton for the MLSS 2026 poster. All result/plot slots are intentionally placeholders for figures generated from the repository's own code.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #111827; }
      .section { font: 700 19px Arial, sans-serif; fill: #111827; }
      .label { font: 600 16px Arial, sans-serif; fill: #111827; }
      .small { font: 400 14px Arial, sans-serif; fill: #4b5563; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #6b7280; }
      .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 2; rx: 16; }
      .dataset { fill: #f8fafc; stroke: #64748b; stroke-width: 2; rx: 16; }
      .model { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; rx: 18; }
      .latent { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2.5; rx: 18; }
      .exp { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .control { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 5; rx: 16; }
      .result { fill: #fafafa; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 6 5; rx: 12; }
      .arrow { stroke: #374151; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .arrow-accent { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-accent); }
      .divider { stroke: #e5e7eb; stroke-width: 2; }
      .slot { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.5; rx: 9; }
    </style>
  </defs>

  <rect width="1600" height="920" fill="#ffffff"/>

  <!-- HEADER -->
  <text x="70" y="58" class="title">What the VAE encoded that we did not ask it to</text>
  <text x="70" y="88" class="small">Hero pipeline — demographic recoverability → downstream impact → removal attempts</text>
  <line x1="70" y1="112" x2="1530" y2="112" class="divider"/>

  <!-- DATASETS -->
  <text x="70" y="150" class="section">1 · Two complementary corpora</text>

  <rect x="70" y="172" width="340" height="170" class="dataset" filter="url(#shadow)"/>
  <text x="95" y="207" class="label">UTKFace</text>
  <text x="95" y="233" class="small">Ground-truth demographics</text>
  <rect x="95" y="250" width="125" height="66" class="slot"/>
  <text x="157" y="278" text-anchor="middle" class="tiny">YOUR DATA</text>
  <text x="157" y="297" text-anchor="middle" class="tiny">composition plot</text>
  <text x="245" y="264" class="small">age</text>
  <text x="245" y="286" class="small">gender</text>
  <text x="245" y="308" class="small">race</text>

  <rect x="440" y="172" width="340" height="170" class="dataset" filter="url(#shadow)"/>
  <text x="465" y="207" class="label">RAF-DB</text>
  <text x="465" y="233" class="small">Emotion + inferred demographics</text>
  <rect x="465" y="250" width="125" height="66" class="slot"/>
  <text x="527" y="278" text-anchor="middle" class="tiny">YOUR DATA</text>
  <text x="527" y="297" text-anchor="middle" class="tiny">composition plot</text>
  <text x="615" y="264" class="small">7 emotions</text>
  <text x="615" y="286" class="small">race / gender / age</text>
  <text x="615" y="308" class="small">FairFace-derived</text>

  <path d="M410 257 H805" class="arrow"/>
  <path d="M780 257 H805" class="arrow"/>

  <!-- VAE -->
  <text x="70" y="392" class="section">2 · Representation learning</text>
  <rect x="70" y="415" width="700" height="165" class="model" filter="url(#shadow)"/>
  <text x="100" y="452" class="label">ResNet-18-style β-VAE</text>
  <text x="100" y="478" class="small">96×96 RGB face → encoder → μ, log σ² → decoder</text>
  <text x="100" y="506" class="small">Training objective: reconstruction + KL only</text>
  <text x="100" y="531" class="small">No demographic supervision · no fairness constraint · no disentanglement term</text>
  <rect x="530" y="447" width="205" height="91" class="slot"/>
  <text x="632" y="480" text-anchor="middle" class="tiny">OPTIONAL OWN FIGURE</text>
  <text x="632" y="501" text-anchor="middle" class="tiny">architecture / reconstruction</text>
  <text x="632" y="522" text-anchor="middle" class="tiny">from train.py / model.py</text>

  <path d="M770 497 H850" class="arrow-accent"/>

  <!-- LATENT -->
  <rect x="850" y="415" width="270" height="165" class="latent" filter="url(#shadow)"/>
  <text x="885" y="452" class="label">Frozen latent μ</text>
  <text x="885" y="480" class="small">128 dimensions</text>
  <text x="885" y="507" class="small">cached once</text>
  <text x="885" y="534" class="small">all downstream probes</text>
  <circle cx="1040" cy="482" r="6" fill="#4f46e5"/>
  <circle cx="1060" cy="500" r="6" fill="#4f46e5"/>
  <circle cx="1080" cy="518" r="6" fill="#4f46e5"/>
  <line x1="1040" y1="482" x2="1080" y2="518" stroke="#4f46e5" stroke-width="2"/>
  <line x1="1060" y1="500" x2="1080" y2="518" stroke="#4f46e5" stroke-width="2"/>

  <!-- EXPERIMENTS -->
  <text x="70" y="628" class="section">3 · What can be read from the frozen representation?</text>

  <!-- Exp A -->
  <rect x="70" y="650" width="340" height="190" class="exp"/>
  <text x="95" y="683" class="label">A · Attribute recoverability</text>
  <text x="95" y="709" class="small">Linear / nonlinear probes</text>
  <text x="95" y="731" class="small">gender · race · age · emotion</text>
  <rect x="95" y="750" width="290" height="68" class="result"/>
  <text x="240" y="777" text-anchor="middle" class="tiny">INSERT OWN PLOT</text>
  <text x="240" y="797" text-anchor="middle" class="tiny">probe performance / AUROC / balanced acc.</text>

  <!-- Exp B -->
  <rect x="430" y="650" width="340" height="190" class="exp"/>
  <text x="455" y="683" class="label">B · Downstream impact</text>
  <text x="455" y="709" class="small">FedAvg · 10 clients · multi-seed</text>
  <text x="455" y="731" class="small">task utility + subgroup gap</text>
  <rect x="455" y="750" width="290" height="68" class="result"/>
  <text x="600" y="777" text-anchor="middle" class="tiny">INSERT OWN PLOT</text>
  <text x="600" y="797" text-anchor="middle" class="tiny">balanced accuracy / gap</text>

  <!-- Controls -->
  <rect x="790" y="650" width="340" height="190" class="control"/>
  <text x="815" y="683" class="label">Controls · preservation, not learning</text>
  <text x="815" y="709" class="small">PCA-128 / pixel baselines</text>
  <text x="815" y="731" class="small">label-shuffled null</text>
  <rect x="815" y="750" width="290" height="68" class="result"/>
  <text x="960" y="777" text-anchor="middle" class="tiny">INSERT OWN PLOT</text>
  <text x="960" y="797" text-anchor="middle" class="tiny">VAE vs PCA / pixels</text>

  <!-- Exp C+D -->
  <rect x="1150" y="650" width="380" height="190" class="exp"/>
  <text x="1175" y="683" class="label">C+D · Can the information be removed?</text>
  <text x="1175" y="709" class="small">GRL adversarial debiasing</text>
  <text x="1175" y="731" class="small">λ sweep + fresh-probe recovery check</text>
  <rect x="1175" y="750" width="330" height="68" class="result"/>
  <text x="1340" y="777" text-anchor="middle" class="tiny">INSERT OWN PLOT</text>
  <text x="1340" y="797" text-anchor="middle" class="tiny">removal vs λ / utility cost</text>

  <!-- arrows from latent to experiments -->
  <path d="M985 580 V620 H240 V650" class="arrow"/>
  <path d="M985 580 V620 H600 V650" class="arrow"/>
  <path d="M985 580 V620 H960 V650" class="arrow"/>
  <path d="M985 580 V620 H1340 V650" class="arrow"/>

  <!-- bottom takeaway -->
  <rect x="70" y="865" width="1460" height="35" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="10"/>
  <text x="800" y="888" text-anchor="middle" class="small">TAKEAWAY SLOT — replace with the final defence-approved one-sentence conclusion from POSTER_DEFENCE.md</text>
</svg>
